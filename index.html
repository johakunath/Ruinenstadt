<canvas id="c"></canvas>
<div id="hud">

  <div class="row"><div class="bar xp"><i id="xpf" style="width:0"></i></div><div class="stat">Stufe <b id="lv">1</b> · Schrott <b id="sc">0</b></div></div>
  <div id="boss" hidden><div id="bossn"></div><div class="bar"><i id="bossf"></i></div></div>
</div>
<div id="pause" role="button" aria-label="Pause und Rucksack" tabindex="0"><svg width="18" height="18" viewBox="0 0 18 18"><rect x="3" y="2" width="4" height="14" fill="#ead9c0"/><rect x="11" y="2" width="4" height="14" fill="#ead9c0"/></svg></div>
<canvas id="mini" width="192" height="192" hidden></canvas>
<div id="fsb" role="button" aria-label="Zurück in den Vollbildmodus" tabindex="0" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ead9c0" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></div>
<div id="fps" hidden></div>
<div id="skill" class="cbtn" role="button" aria-label="Kraft">Wirbel</div>
<div id="ult" class="cbtn" role="button" aria-label="Ultimative Kraft">Ulti</div>
<div id="c1" class="cbtn cons" role="button" aria-label="Verband benutzen"><span>Verband</span><b id="c1n">0</b></div>
<div id="c2" class="cbtn cons" role="button" aria-label="Molotow werfen"><span>Molotow</span><b id="c2n">0</b></div>
<div id="dash" class="cbtn" role="button" aria-label="Sprint">Sprint</div>
<div id="atk" class="cbtn" role="button" aria-label="Angreifen">Hieb</div>
<div id="bufs"></div>
<div id="streak" hidden><b id="stn">0</b><span>Serie</span></div>
<div id="toasts"></div>
<div id="banner"></div>

<div id="optv" class="ov" hidden><div class="box" id="optbox"></div></div>
<div id="perk" class="ov" hidden><div class="box" id="perkbox"></div></div>
<div id="trade" class="ov" hidden><div class="box" id="tradebox"></div></div>
<div id="stw" class="ov stn" hidden><div class="box" id="stnbox"></div></div>
<div id="lootwarn" class="ov" role="alertdialog" aria-modal="true" aria-labelledby="lootwarn-title" aria-describedby="lootwarn-desc" hidden><div class="box"><h2 id="lootwarn-title">Beute vergessen?</h2><p class="lead" id="lootwarn-desc">Wertvolle Beute liegt noch.</p><div class="btns"><button id="lootfind" class="btn main" data-lootexit="find">Beute suchen</button><button class="btn" data-lootexit="leave">Trotzdem gehen</button></div></div></div>
<div id="end" class="ov" hidden><div class="box" id="endbox"></div></div>
