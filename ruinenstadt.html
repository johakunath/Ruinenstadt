<style>
/* Layout: full-bleed canvas world; HUD and toasts top; thumb controls bottom-right; overlays as scrolling panels */
:root{--ash:#17110d;--panel:#1d1611;--soot:#2a211b;--rust:#993C1D;--ember:#EF9F27;--bone:#ead9c0;--blood:#c23a2e;--dim:#a8957d;--edge:#4a3a2e;--good:#8fd16a;--bad:#ff6b5a;
--f-display:'Pirata One','Times New Roman',serif;--f-ui:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--ash);color:var(--bone);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}

.stat{font-size:17px;font-weight:600;letter-spacing:.05em;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}

#boss{display:grid;gap:3px;justify-items:center;margin-top:4px;margin-right:56px}
#bossn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

#bossn{font:22px var(--f-display);color:var(--ember)}

#trade{background:rgba(14,10,7,.88)}
#toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 168px);display:grid;justify-items:center;gap:5px;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

#menu{background:rgba(14,10,7,.78)}
body:not(.inrun) .cbtn,body:not(.inrun) #hud,body:not(.inrun) #pause{display:none}
#perk{background:rgba(14,10,7,.82);align-content:center}
.box{width:100%;max-width:440px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
h1{font:68px/1 var(--f-display);color:var(--ember);margin:8px 0 0;font-weight:400;text-align:center}
h2{font:44px/1.05 var(--f-display);color:var(--ember);margin:0;font-weight:400;text-align:center;text-wrap:balance}

.hint{font-size:16px;color:var(--dim);line-height:1.45;text-align:center;margin:0}
.btn{font:600 18px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;padding:12px 18px;background:rgba(13,9,7,.6);color:var(--bone);border:1px solid var(--edge);border-radius:3px;cursor:pointer}

.dn{font:26px var(--f-display)}
.dm{font-size:15px;color:var(--dim)}
.scrap{font-size:18px;color:var(--dim);text-align:center}.scrap b{color:var(--bone)}
.cloud{font-size:15px;color:var(--dim);text-align:center}

.slot.sel .ic,.cell.sel{outline:2px solid var(--bone);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.cell{aspect-ratio:1;border:1px solid #2f251e;border-radius:3px;background:#120d0a;display:grid;place-items:center;padding:0;cursor:pointer;position:relative}
.cell .up{position:absolute;top:1px;right:3px;color:var(--good);font-size:13px;font-weight:600}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:4px;padding:12px 14px;display:grid;gap:6px;min-height:96px}
.card .nm{font-size:22px;font-weight:600;line-height:1.15}
.card .sub{font-size:16px;color:var(--dim)}
.card .st{font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{font:600 15px var(--f-ui);letter-spacing:.04em;padding:8px 12px;background:rgba(13,9,7,.6);color:var(--bone);border:1px solid var(--edge);border-radius:3px;cursor:pointer}
.chip.warn{border-color:var(--bad);color:var(--bad)}
.cell .lk{position:absolute;right:3px;bottom:3px}

.cmp{display:flex;justify-content:space-between;gap:10px;font-size:16px;min-width:0;font-variant-numeric:tabular-nums}.cmp span:first-child{color:var(--dim)}
.af{font-size:17px}
.pbar{height:5px;background:#2f251e;margin-top:6px;border-radius:1px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--ember)}
.ok{color:var(--good)}
.lbl{font-size:14px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;text-align:center}
.upg{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;background:var(--panel);border:1px solid var(--edge);border-radius:4px;padding:12px 14px}
.upg .un{font-size:20px;font-weight:600}
.upg .ud{font-size:16px;color:var(--dim)}
.pips{display:flex;gap:3px;margin-top:2px}.pips i{width:12px;height:5px;background:#2f251e;border-radius:1px}.pips i.f{background:var(--ember)}
.msg{font-size:16px;color:var(--bad);text-align:center;min-height:20px}
.stats{display:grid;gap:4px;font-size:19px;text-align:center}
.pcard{display:grid;gap:4px;text-align:left;padding:14px 16px;background:var(--panel);border:1px solid var(--edge);border-radius:4px;color:var(--bone);cursor:pointer;font-family:var(--f-ui)}
.pcard:active{border-color:var(--ember)}
.pn{font:30px/1.05 var(--f-display);color:var(--ember)}
.pd{font-size:19px}
.pl{font-size:15px;color:var(--dim)}
@media (prefers-reduced-motion:reduce){.toast{animation-name:tr}@keyframes tr{0%,85%{opacity:1}100%{opacity:0}}#pause.hot{animation:none}}
</style>

<script>
const $=id=>document.getElementById(id);
const WS=1600,BAG=18,STASH0=40,R=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),pick=a=>a[Math.floor(Math.random()*a.length)];

/* ================= save (local + cloud) ================= */
const START_W=()=>({id:1,slot:'w',kind:'blade',base:'latte',name:'Holzlatte',r:0,val:3,ilvl:0});
let S;
function defSave(){return{scrap:0,upg:{dmg:0,hp:0,dash:0,luck:0},unlocked:1,best:[0,0,0,0,0],cons:{verband:1,molotow:1},threat:0,tmax:0,music:true,camp:{},rec:{kills:0,legs:0,runs:0,wins:0,time:0,chests:0,bosses:0},ach:{},tips:{},eq:{w:START_W(),a:null,t:null},bag:[],stash:[],mast:{blade:0,hammer:0,sling:0},jobs:[],mute:false,eco:false,dist:0,diff:1,t:0};}
function fix(s){s=Object.assign(defSave(),s);if(!s.eq||!s.eq.w)s.eq={w:START_W(),a:s.eq&&s.eq.a||null,t:s.eq&&s.eq.t||null};if(s.bag.length>BAG)s.bag.length=BAG;if(!Array.isArray(s.stash))s.stash=[];while(s.best.length<5)s.best.push(0);if(!s.cons)s.cons={verband:1,molotow:1};if(!s.rec)s.rec={kills:0,legs:0,runs:0,wins:0,time:0};if(s.tmax==null){s.tmax=0;s.threat=0;}if(s.music==null)s.music=true;if(!s.camp)s.camp={};if(s.rec.chests==null){s.rec.chests=0;s.rec.bosses=0;}if(!s.ach)s.ach={};if(!s.tips)s.tips={};if(!s.mast)s.mast={blade:0,hammer:0,sling:0};if(!Array.isArray(s.jobs))s.jobs=[];return s;}
function load(){try{const s=JSON.parse(localStorage.getItem('rs2'));if(s&&s.upg&&s.eq)S=fix(s);}catch(e){}if(!S)S=defSave();}
const cloud={ref:null,state:'off',busy:false,dirty:false,timer:0};
function save(){checkAch();S.t=Date.now();try{localStorage.setItem('rs2',JSON.stringify(S));}catch(e){}cloudQueue();}
function cloudQueue(){if(!cloud.ref||cloud.state==='err')return;cloud.dirty=true;clearTimeout(cloud.timer);cloud.timer=setTimeout(cloudPush,3000);}
async function cloudPush(retry){
  if(!cloud.ref||!cloud.dirty)return;if(cloud.busy){cloud.timer=setTimeout(cloudPush,1500);return;}
  cloud.busy=true;cloud.dirty=false;
  try{await cloud.ref.set({s:JSON.stringify(S),t:S.t,v:4});cloud.state='on';}
  catch(e){const c=e&&e.code;if((c==='unavailable'||c==='resource_exhausted')&&!retry){cloud.busy=false;cloud.dirty=true;setTimeout(()=>cloudPush(true),2000+Math.random()*2000);return;}cloud.state='err';}
  cloud.busy=false;if(cloud.dirty)cloud.timer=setTimeout(cloudPush,3000);if(state==='menu')renderMenu();}
async function initCloud(){
  const C=window.claude;if(!C||!C.use)return;
  try{const[db,user]=await Promise.all([C.use('db'),C.use('user')]);if(!db||!user)return;const id=await user.id();if(!id)return;
    cloud.ref=db.doc('data/users/'+id+'/save');cloud.state='sync';if(state==='menu')renderMenu();
    const slow=setTimeout(()=>{if(cloud.state==='sync'){cloud.state='slow';if(state==='menu')renderMenu();}},10000);
    const snap=await cloud.ref.get();clearTimeout(slow);
    const rd=snap.exists?snap.data():null;let rs=null;try{rs=rd&&rd.s?JSON.parse(rd.s):null;}catch(e){}
    if(rs&&(rs.t||0)>(S.t||0)&&state==='menu'){S=fix(rs);fillJobs();try{localStorage.setItem('rs2',JSON.stringify(S));}catch(e){}resize();S.dist=Math.min(S.dist,S.unlocked-1);buildWorld(DIST[S.dist]);ST=stats();P.hp=ST.maxHp;toast('Spielstand aus der Cloud geladen');}
    else if(S.t&&(!rs||(rs.t||0)<S.t)){cloud.dirty=true;await cloudPush();}
    cloud.state=cloud.state==='err'?'err':'on';if(state==='menu')renderMenu();
  }catch(e){cloud.state=cloud.ref?'err':'off';if(state==='menu')renderMenu();}}
load();

/* ================= canvas ================= */
const cv=$('c'),ctx=cv.getContext('2d'),lc=document.createElement('canvas'),lx=lc.getContext('2d');
let VW=0,VH=0,DPR=1,LS=.5;
function resize(){DPR=Math.min(1.5,window.devicePixelRatio||1);LS=S.eco?.3:.5;VW=innerWidth;VH=innerHeight;cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);cv.style.width=VW+'px';cv.style.height=VH+'px';lc.width=Math.ceil(VW*LS);lc.height=Math.ceil(VH*LS);}
addEventListener('resize',resize);resize();
function cnv(w,h){const c=document.createElement('canvas');c.width=Math.ceil(w);c.height=Math.ceil(h);return c;}
function radial(stops){const c=cnv(128,128),g=c.getContext('2d'),gr=g.createRadialGradient(64,64,0,64,64,64);stops.forEach(s=>gr.addColorStop(s[0],s[1]));g.fillStyle=gr;g.fillRect(0,0,128,128);return c;}
const LSPR=radial([[0,'rgba(0,0,0,1)'],[.45,'rgba(0,0,0,.65)'],[1,'rgba(0,0,0,0)']]);
const VIG=radial([[0,'rgba(150,20,10,0)'],[.62,'rgba(150,20,10,0)'],[1,'rgba(150,20,10,.85)']]);
const FIRE=radial([[0,'rgba(255,120,40,.24)'],[1,'rgba(255,120,40,0)']]);
const GL={};const glow=c=>GL[c]||(GL[c]=radial([[0,c+'cc'],[.35,c+'55'],[1,c+'00']]));
function dark(hex,f){const n=parseInt(hex.slice(1),16);return'rgb('+[(n>>16)&255,(n>>8)&255,n&255].map(v=>Math.round(v*f)).join(',')+')';}
function rr(g,x,y,w,h,r){g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h);g.fill();}

/* ================= data ================= */
const RAR=[{n:'Gewöhnlich',c:'#e8ddd0',m:1},{n:'Magisch',c:'#7d9bff',m:1.35},{n:'Selten',c:'#f2d14b',m:1.8},{n:'Legendär',c:'#ff8a3d',m:2.6}];
const ELC={fire:'#ff6a2a',acid:'#97C459',shock:'#7dd3ff'},ELN={fire:'Feuer',acid:'Säure',shock:'Strom'};
const RES={raser:{fire:1.2,acid:1.2,shock:.6},ghoul:{fire:1.6,acid:1,shock:1},brute:{fire:.5,acid:1.6,shock:1},spitter:{fire:1,acid:0,shock:1.6},koloss:{fire:.5,acid:1,shock:1.8},brand:{fire:0,acid:1.6,shock:1},hauptmann:{fire:1.3,acid:1,shock:1.3},hexe:{fire:1.6,acid:0,shock:1},turm:{fire:1,acid:1.6,shock:0},flieger:{fire:1,acid:1.3,shock:1.6}};
const BN=['Der Hauptmann von Köpenick','Die Spreehexe','Der Turmwächter','Der Fliegerkönig','Der Brandmeister'],BK=['hauptmann','hexe','turm','flieger','brand'];
const ER=(e,el)=>RES[e.type==='boss'?(e.big?BK[e.v]||'brand':'koloss'):e.type][el];

const keys={};let atkHeld=false,dashReq=false,skillReq=false;const joy={id:null,ox:0,oy:0,x:0,y:0};let rightId=null;
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'){atkHeld=true;e.preventDefault();}if(e.code==='ShiftLeft'||e.code==='ShiftRight')dashReq=true;if(e.code==='KeyE')skillReq=true;
  if(e.code==='Escape'||e.code==='KeyP'){if(state==='play')pauseGame();else if(state==='paused')resume();}});
addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='Space')atkHeld=false;});
cv.addEventListener('pointerdown',e=>{if(state!=='play')return;
  if(e.clientX<VW*.55&&joy.id===null){joy.id=e.pointerId;joy.ox=e.clientX;joy.oy=e.clientY;joy.x=joy.y=0;}
  else if(rightId===null){rightId=e.pointerId;atkHeld=true;$('atk').classList.add('on');}try{cv.setPointerCapture(e.pointerId);}catch(_){}});
cv.addEventListener('pointermove',e=>{if(e.pointerId===joy.id){let dx=e.clientX-joy.ox,dy=e.clientY-joy.oy;const d=Math.hypot(dx,dy),m=50;if(d>m){dx*=m/d;dy*=m/d;}joy.x=dx/m;joy.y=dy/m;}});
const up=e=>{if(e.pointerId===joy.id){joy.id=null;joy.x=joy.y=0;}if(e.pointerId===rightId){rightId=null;atkHeld=false;$('atk').classList.remove('on');}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
const atkB=$('atk');atkB.addEventListener('pointerdown',e=>{e.preventDefault();atkHeld=true;atkB.classList.add('on');try{atkB.setPointerCapture(e.pointerId);}catch(_){}});
['pointerup','pointercancel'].forEach(n=>atkB.addEventListener(n,()=>{atkHeld=false;atkB.classList.remove('on');}));
$('dash').addEventListener('pointerdown',e=>{e.preventDefault();dashReq=true;});
$('skill').addEventListener('pointerdown',e=>{e.preventDefault();skillReq=true;});
$('pause').addEventListener('click',()=>{if(state==='play')pauseGame();});
document.addEventListener('visibilitychange',()=>{try{if(AC){if(document.hidden)AC.suspend();else AC.resume();}}catch(e){}if(document.hidden){if(state==='play')pauseGame();if(cloud.dirty){clearTimeout(cloud.timer);cloudPush();}}});
